name: Flattened build

'on':
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flattened-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up OCaml and opam
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "4.14"
          opam-repositories: |
            coq-released: https://coq.inria.fr/opam/released
            default: https://opam.ocaml.org

      - name: Install dependencies
        run: opam install . --deps-only --yes

      - name: Configure temporary commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build flattened sources
        id: flattened
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s unlimited
          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          archive_stamp="$(date -u -d "@${commit_epoch}" +%Y%m%d-%H%M%S)"
          archive_path="dist/${archive_stamp}-pgg-smc-flat.tar.gz"
          active_switch="$(opam switch show --safe)"
          ROCQ_OPAM_SWITCH="$active_switch" FLATTEN_JOBS=1 \
            ./scripts/flatten_artifact.sh "$GITHUB_SHA" "$archive_path"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload flattened archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgg-smc-flat-${{ github.sha }}
          path: ${{ steps.flattened.outputs.archive_path }}
          if-no-files-found: error
